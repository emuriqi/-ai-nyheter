# CI for det frittstående repoet (github.com/emuriqi/-ai-nyheter), der denne mappen er roten.
# I emuriqi/Bot brukes .github/workflows/ai-nyheter.yml i rotmappen i stedet.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./prisma/ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
